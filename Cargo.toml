[package]
name = "notmpc"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A terminal MPD client drawn with notcurses: album art, a spectrum visualizer, rmpc keys"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/gtlaserbeast/notmpc"
keywords = ["mpd", "music", "tui", "notcurses"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[build-dependencies]
bindgen = { version = "0.73.2", features = ["experimental"] }
cc = "1.10.0"
pkg-config = "0.3.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
