[package]
name = "notmpc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "ogg", "vorbis", "wav", "pcm", "isomp4", "aac", "alac"] }
toml = "1.1.8"

[build-dependencies]
bindgen = { version = "0.73.2", features = ["experimental"] }
cc = "1.10.0"
pkg-config = "0.3.34"
