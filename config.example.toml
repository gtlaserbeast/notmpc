# notmpc config: copy to ~/.config/notmpc/config.toml.
# Everything is optional, so an empty file (or none) is fine. The default
# keys are rmpc's; the default theme uses the terminal's palette.

volume_step = 5       # for VolumeUp/VolumeDown, unbound by default
seek_step = 5         # seconds
art_width = 60        # max % of the queue tab for album art (sized to fit a square cover)
art_style = "pixels"  # or "braille" (dithered dots in the cover's colours), "blocks" (half blocks)
group_by_album = true # false = rmpc's flat Artist/Title/Album/Date table
follow_cursor = true  # the song under the queue cursor plays next (F toggles)
status_update_interval_ms = 1000  # bitrate / position refresh while playing
progress_bar = "braille"  # or "pixel" (an image), "symbols" (progress_symbols)
visualizer = true     # spectrum behind the header (needs MPD's fifo output)
# visualizer_fifo = "/run/user/1000/mpd/visualizer.fifo"
visualizer_rows = 6   # header height with the spectrum on (2-12; 2 = as without it)
visualizer_fps = 20
visualizer_style = "braille"  # two bars per column; "octants": the same, solid; "blocks": one, in eighth blocks
visualizer_delay_ms = 150  # speakers' lag behind MPD; [ and ] tune it live (saved)
marquee_speed = 8     # cells/s that too-long text scrolls on the highlighted row; 0 = cut with …
marquee_count = "once"  # times it scrolls round before stopping at …: a number, "off", "once", "infinite"

# Keys use rmpc notation: "p", "G", "<C-k>", "<S-Tab>", "<CR>", "<Space>".
# Actions use rmpc names. Bindings here are added on top of the defaults;
# "None" unbinds one. Lookup order on the queue tab: queue, navigation, global.
[keys.global]
# "p" = "TogglePause"
# "s" = "None"
# "." = "VolumeUp"   # rmpc's volume keys, unbound by default
# "," = "VolumeDown"

[keys.navigation]
# "<C-n>" = "Down"

[keys.queue]
# "x" = "Delete"

# Colours: "#rrggbb", "default", or a terminal palette name (black, red,
# green, yellow, blue, magenta, cyan, gray, dark_gray, light_*, white) or
# index ("208"). Palette names follow the terminal's own theme, as in rmpc.
# Each entry is a colour or a { fg, bg, bold, italic } table.
[theme]
# cursor = { fg = "black", bg = "#dd6f00", bold = true }
# current = { fg = "#dd6f00", bold = true }
# progress_thumb = "#a7ff04"
# album_artist = "cyan"
# visualizer_colors = "aurora"  # or ember, ocean, sunset, mono, or a list of colours
#                                 # (bass to treble): ["#7b2ff7", "#12c2a0"], or palette
#                                 # slots that follow the terminal theme: ["2", "4"]
# start cap, elapsed, thumb, remaining, end cap (" " leaves the spectrum
# showing through); Nerd Font glyphs work too, e.g. "\ue0b7" / "\ue0b5" caps:
# progress_symbols = ["", "━", "●", "─", ""]
# dir_symbol = "▸"
# Header modes: repeat, random, consume, single, follow (lit = on, dim = off).
# With a Nerd Font, icons instead of words:
# mode_symbols = ["\U000f0456", "\U000f049d", "\U000f0413", "\U000f0458", "\U000f01a4"]
# song_symbol = "♪"
#
# Every entry: text state title artist volume mode_on mode_off tab_active
# tab_inactive cursor browse browse_rail current album date group_header dim
# progress_elapsed progress_thumb progress_track progress_symbols mode_symbols label
# album_artist panel panel_border visualizer_colors dir_symbol song_symbol
